name: Check generated migration docs

# references/docs/ in the axon4to5-migrate-code skill is generated by
# scripts/sync-migration-docs.sh from AxonIQ/AxonFramework. This job fails when
# someone hand-edits it, and warns (without failing) when upstream has moved on.

on:
  pull_request:
    paths:
      - 'plugins/axoniq-migration/skills/axon4to5-migrate-code/references/docs/**'
      - 'scripts/sync-migration-docs.sh'
      - '.github/workflows/check-migration-docs.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated docs match their manifest
        run: |
          set +e
          scripts/sync-migration-docs.sh --check
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "::notice::Migration docs are in sync with upstream main."
              ;;
            2)
              echo "::warning::Upstream AxonFramework main has moved on. Run scripts/sync-migration-docs.sh to refresh the migration docs."
              ;;
            *)
              echo "::error::references/docs is generated and was hand-edited. Fix the content upstream in AxonIQ/AxonFramework, then run scripts/sync-migration-docs.sh."
              exit 1
              ;;
          esac
